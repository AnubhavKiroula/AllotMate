name: CI Build Gate

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  build:
    name: Build and Check
    runs-on: ubuntu-latest

    # Live PostgreSQL so the database-layer integration tests actually run.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: allotmate
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: allotmate
      DB_USER: postgres
      DB_PASSWORD: postgres
      PGPASSWORD: postgres

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpqxx-dev postgresql-client pkg-config

      - name: Load schema and seed data
        run: |
          psql -h localhost -U postgres -d allotmate -v ON_ERROR_STOP=1 -f sql/01_init_schema.sql
          psql -h localhost -U postgres -d allotmate -v ON_ERROR_STOP=1 -f sql/02_seed_data.sql

      - name: Configure CMake
        run: |
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS="-Wall -Wextra -Werror"

      - name: Build
        run: |
          cmake --build build --config Release

      - name: Run Tests
        run: |
          ctest --test-dir build --output-on-failure
