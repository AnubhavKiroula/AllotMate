<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" role="img" aria-labelledby="title desc">
  <title id="title">AllotMate</title>
  <desc id="desc">A stable matching: three students on the left, each joined to one elective seat on the right.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#25407f"/>
      <stop offset="1" stop-color="#14224b"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="156" height="156" rx="36" fill="url(#bg)" stroke="#3b5aa3" stroke-width="2"/>
  <!-- Matches, drawn first so the nodes sit on top of the line ends -->
  <g fill="none" stroke="#5fd4ae" stroke-width="6" stroke-linecap="round">
    <path d="M58 48 L99 80"/>
    <path d="M58 80 L99 48"/>
    <path d="M58 112 L99 112"/>
  </g>
  <!-- Students -->
  <g fill="#eef1fa">
    <circle cx="48" cy="48" r="10"/>
    <circle cx="48" cy="80" r="10"/>
    <circle cx="48" cy="112" r="10"/>
  </g>
  <!-- Elective seats -->
  <g fill="#eef1fa" fill-opacity="0.08" stroke="#eef1fa" stroke-width="5">
    <rect x="101" y="37" width="22" height="22" rx="6"/>
    <rect x="101" y="69" width="22" height="22" rx="6"/>
    <rect x="101" y="101" width="22" height="22" rx="6"/>
  </g>
</svg>
